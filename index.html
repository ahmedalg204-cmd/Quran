<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مركز أم القرى لتحفيظ القرآن الكريم والسنة النبوية</title>

    <style>
        :root {
            --primary: #065f46;
            --secondary: #047857;
            --bg: #f3f4f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 12px;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 16px;
            padding: 18px 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.3rem;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .card h2 {
            color: var(--primary);
            margin-top: 0;
            font-size: 1.05rem;
            border-bottom: 2px solid #ecfdf5;
            padding-bottom: 8px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin: 4px 0;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            background: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .student-item {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            background: #fff;
        }

        .student-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }

        .badge {
            background: #d1fae5;
            color: #065f46;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .form-row {
            display: flex;
            gap: 6px;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #e5e7eb;
            color: #374151;
            font-size: 12px;
            border-radius: 8px;
            text-align: center;
            border: none;
            font-weight: bold;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .loading {
            text-align: center;
            color: #6b7280;
            padding: 15px;
        }

        .error-box {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            direction: ltr;
            text-align: left;
            font-size: 12px;
            word-break: break-word;
        }

        .success-box {
            background: #dcfce7;
            color: #166534;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🕌 مركز أم القرى</h1>
    <p>لتحفيظ القرآن الكريم والسنة النبوية</p>
</div>

<div class="nav-tabs">

    <button
        class="tab-btn active"
        id="tabMainBtn"
        onclick="switchTab('main')">
        إدارة المركز (المعلم)
    </button>

    <button
        class="tab-btn"
        id="tabParentBtn"
        onclick="switchTab('parent')">
        👨‍👩‍👦 بوابة ولي الأمر
    </button>

</div>


<!-- ========================= -->
<!-- إدارة المعلم -->
<!-- ========================= -->

<div id="tabMain">

    <div class="card">

        <h2>➕ تسجيل طالب جديد</h2>

        <input
            type="text"
            id="studentName"
            placeholder="اسم الطالب الثلاثي">

        <input
            type="tel"
            id="parentPhone"
            placeholder="رقم هاتف ولي الأمر (مثال: 091xxxxxxx)">

        <div class="form-row">

            <input
                type="text"
                id="haloqaName"
                placeholder="اسم الحلقة (مثال: قالون)">

            <select id="startJuz">

                <option value="الجزء 1">
                    الجزء 1
                </option>

                <script>
                    for (let i = 2; i <= 30; i++) {
                        document.write(
                            `<option value="الجزء ${i}">
                                الجزء ${i}
                            </option>`
                        );
                    }
                </script>

            </select>

        </div>

        <button onclick="addStudent()">
            حفظ الطالب في السحابة ☁️
        </button>

        <div id="addMessage"></div>

    </div>


    <div class="card">

        <h2>👥 قائمة الطلاب والتحضير السحابي</h2>

        <div id="studentsList">

            <div class="loading">
                جاري الاتصال بالسحابة...
            </div>

        </div>

    </div>

</div>


<!-- ========================= -->
<!-- ولي الأمر -->
<!-- ========================= -->

<div
    id="tabParent"
    style="display:none;"
>

    <div class="card">

        <h2>🔑 تسجيل دخول ولي الأمر</h2>

        <p style="font-size:12px;color:#6b7280;">
            أدخل رقم الهاتف المسجل للاطلاع على تقرير الطالب المحدث أونلاين:
        </p>

        <input
            type="tel"
            id="loginPhone"
            placeholder="أدخل رقم الهاتف (مثال: 091xxxxxxx)">

        <button
            onclick="searchParentStudent()"
            style="background:#2563eb;">
            عرض تقرير الطالب 📡
        </button>

    </div>

    <div id="parentResult"></div>

</div>


<script>

/* ==========================================
   إعدادات Supabase
   ========================================== */

const SUPABASE_URL =
    "https://lqththarryzdanqfeqsa.supabase.co";

const API_URL =
    SUPABASE_URL + "/rest/v1/students";


/*
    ضع هنا مفتاحك الجديد الذي يبدأ بـ:

    sb_publishable_

    ولا تضع service_role أو sb_secret
*/

const API_KEY =
    "ضع_هنا_مفتاح_sb_publishable_الخاص_بك";


/*
    مهم:
    لا نضع Authorization: Bearer
    مع publishable key الجديدة.
*/

const headers = {
    "apikey": API_KEY,
    "Content-Type": "application/json"
};


/* ==========================================
   تبديل التبويبات
   ========================================== */

function switchTab(tab) {

    document.getElementById("tabMain").style.display =
        tab === "main" ? "block" : "none";

    document.getElementById("tabParent").style.display =
        tab === "parent" ? "block" : "none";

    document.getElementById("tabMainBtn")
        .classList.toggle(
            "active",
            tab === "main"
        );

    document.getElementById("tabParentBtn")
        .classList.toggle(
            "active",
            tab === "parent"
        );
}


/* ==========================================
   تحميل الطلاب
   ========================================== */

async function fetchStudents() {

    const list =
        document.getElementById("studentsList");

    try {

        list.innerHTML = `
            <div class="loading">
                جاري الاتصال بالسحابة...
            </div>
        `;

        const res = await fetch(
            API_URL + "?select=*&order=id.desc",
            {
                method: "GET",
                headers: headers
            }
        );

        const responseText =
            await res.text();

        console.log(
            "Supabase Status:",
            res.status
        );

        console.log(
            "Supabase Response:",
            responseText
        );

        if (!res.ok) {

            throw new Error(
                "HTTP " +
                res.status +
                ": " +
                responseText
            );
        }

        const data =
            JSON.parse(responseText);

        renderStudents(data);

    }

    catch (err) {

        console.error(
            "SUPABASE ERROR:",
            err
        );

        list.innerHTML = `
            <div class="error-box">

                <strong>
                    ❌ Supabase Error
                </strong>

                <br><br>

                ${escapeHTML(err.message)}

            </div>
        `;
    }
}


/* ==========================================
   إضافة طالب
   ========================================== */

async function addStudent() {

    const name =
        document
            .getElementById("studentName")
            .value
            .trim();

    const phone =
        document
            .getElementById("parentPhone")
            .value
            .trim();

    const haloqa =
        document
            .getElementById("haloqaName")
            .value
            .trim()
        || "الحلقة العامة";

    const currentjuz =
        document
            .getElementById("startJuz")
            .value
        || "الجزء 1";

    const message =
        document.getElementById(
            "addMessage"
        );


    if (!name || !phone) {

        alert(
            "يرجى إدخال اسم الطالب ورقم الهاتف"
        );

        return;
    }


    try {

        message.innerHTML = `
            <div class="loading">
                جاري حفظ الطالب...
            </div>
        `;


        const res = await fetch(
            API_URL,
            {
                method: "POST",

                headers: {
                    ...headers,
                    "Prefer":
                        "return=representation"
                },

                body: JSON.stringify({

                    name: name,

                    phone: phone,

                    haloqa: haloqa,

                    currentjuz: currentjuz

                })
            }
        );


        const responseText =
            await res.text();


        console.log(
            "Add Student Status:",
            res.status
        );


        console.log(
            "Add Student Response:",
            responseText
        );


        if (!res.ok) {

            throw new Error(
                "HTTP " +
                res.status +
                ": " +
                responseText
            );
        }


        document.getElementById(
            "studentName"
        ).value = "";

        document.getElementById(
            "parentPhone"
        ).value = "";

        document.getElementById(
            "haloqaName"
        ).value = "";


        message.innerHTML = `
            <div class="success-box">
                ✅ تم حفظ الطالب بنجاح
            </div>
        `;


        fetchStudents();

    }

    catch (err) {

        console.error(
            "ADD STUDENT ERROR:",
            err
        );

        message.innerHTML = `
            <div class="error-box">

                <strong>
                    ❌ فشل حفظ الطالب
                </strong>

                <br><br>

                ${escapeHTML(err.message)}

            </div>
        `;
    }
}


/* ==========================================
   حذف طالب
   ========================================== */

async function deleteStudent(id) {

    if (
        !confirm(
            "هل أنت متأكد من مسح هذا الطالب؟"
        )
    ) {
        return;
    }


    try {

        const res =
            await fetch(
                API_URL +
                "?id=eq." +
                encodeURIComponent(id),
                {
                    method: "DELETE",
                    headers: headers
                }
            );


        const responseText =
            await res.text();


        if (!res.ok) {

            throw new Error(
                "HTTP " +
                res.status +
                ": " +
                responseText
            );
        }


        fetchStudents();

    }

    catch (err) {

        alert(
            "فشل حذف الطالب:\n\n" +
            err.message
        );
    }
}


/* ==========================================
   بحث ولي الأمر
   ========================================== */

async function searchParentStudent() {

    const phoneInput =
        document
            .getElementById(
                "loginPhone"
            )
            .value
            .trim();


    const resultDiv =
        document.getElementById(
            "parentResult"
        );


    if (!phoneInput) {

        alert(
            "يرجى إدخال رقم الهاتف"
        );

        return;
    }


    resultDiv.innerHTML = `
        <div class="card">
            <div class="loading">
                جاري البحث أونلاين...
            </div>
        </div>
    `;


    try {

        const url =
            API_URL +
            "?phone=eq." +
            encodeURIComponent(
                phoneInput
            ) +
            "&select=*";


        const res =
            await fetch(
                url,
                {
                    method: "GET",
                    headers: headers
                }
            );


        const responseText =
            await res.text();


        if (!res.ok) {

            throw new Error(
                "HTTP " +
                res.status +
                ": " +
                responseText
            );
        }


        const data =
            JSON.parse(responseText);


        if (
            !Array.isArray(data) ||
            data.length === 0
        ) {

            resultDiv.innerHTML = `
                <div
                    class="card"
                    style="
                        text-align:center;
                        color:#ef4444;
                    "
                >
                    ❌ لم يتم العثور على طالب بهذا الرقم.
                </div>
            `;

            return;
        }


        resultDiv.innerHTML =
            data.map(
                s => `

                <div
                    class="card"
                    style="
                        border-top:
                        4px solid var(--primary);
                    "
                >

                    <h2 style="margin:0;">

                        👤 الطالب:

                        ${escapeHTML(s.name)}

                    </h2>


                    <p
                        style="
                            margin:4px 0;
                            font-size:13px;
                            color:#4b5563;
                        "
                    >

                        🕌 الحلقة:

                        <strong>
                            ${escapeHTML(
                                s.haloqa ||
                                "العامة"
                            )}
                        </strong>

                    </p>


                    <hr
                        style="
                            border:none;
                            border-top:
                            1px solid #f3f4f6;
                            margin:8px 0;
                        "
                    >


                    <p style="margin:6px 0;">

                        📖

                        <strong>
                            الجزء الحالي:
                        </strong>

                        ${escapeHTML(
                            s.currentjuz ||
                            "الجزء 1"
                        )}

                    </p>

                </div>
            `
            ).join("");

    }

    catch (err) {

        console.error(
            "PARENT SEARCH ERROR:",
            err
        );


        resultDiv.innerHTML = `
            <div class="error-box">

                <strong>
                    ❌ خطأ في الاتصال
                </strong>

                <br><br>

                ${escapeHTML(
                    err.message
                )}

            </div>
        `;
    }
}


/* ==========================================
   عرض الطلاب
   ========================================== */

function renderStudents(students) {

    const listContainer =
        document.getElementById(
            "studentsList"
        );


    if (
        !Array.isArray(students) ||
        students.length === 0
    ) {

        listContainer.innerHTML = `
            <p
                style="
                    text-align:center;
                    color:#6b7280;
                "
            >
                لا يوجد طلاب مضافون حتى الآن
            </p>
        `;

        return;
    }


    listContainer.innerHTML =
        students.map(
            s => `

            <div class="student-item">

                <div class="student-title">

                    <span>
                        👤
                        ${escapeHTML(s.name)}
                    </span>

                    <span class="badge">
                        📱
                        ${escapeHTML(s.phone)}
                    </span>

                </div>


                <p
                    style="
                        font-size:12px;
                        margin:4px 0;
                    "
                >

                    الحلقة:

                    ${escapeHTML(
                        s.haloqa || "-"
                    )}

                    |

                    الجزء:

                    ${escapeHTML(
                        s.currentjuz || "-"
                    )}

                </p>


                <button
                    style="
                        background:none;
                        color:#ef4444;
                        font-size:11px;
                        padding:4px 0;
                        text-align:left;
                    "
                    onclick="
                        deleteStudent(${s.id})
                    "
                >

                    حذف الطالب

                </button>

            </div>
        `
        ).join("");
}


/* ==========================================
   حماية النصوص
   ========================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==========================================
   تشغيل الموقع
   ========================================== */

fetchStudents();

</script>

</body>
</html>
